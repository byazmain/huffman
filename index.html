<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huffman Encoder / Decoder</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
  --text:#e8eaed; --muted:#9aa3b2; --accent:#6ee7b7; --accent2:#60a5fa;
  --danger:#f87171; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f1f4; --border:#dfe2e8;
    --text:#1a1d23; --muted:#5b6472; --accent:#059669; --accent2:#2563eb; --danger:#dc2626;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
  --text:#e8eaed; --muted:#9aa3b2; --accent:#6ee7b7; --accent2:#60a5fa; --danger:#f87171;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 60px;}
h1{font-size:1.5rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:22px;}
.tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.tab{
  padding:10px 18px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;
  font-weight:600;font-size:.95rem;user-select:none;
}
.tab.active{color:var(--accent);border-color:var(--accent);}
.panel{display:none;}
.panel.active{display:block;}
textarea,input[type=text]{
  width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:.9rem;resize:vertical;
}
textarea{min-height:100px;}
label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px;font-weight:600;}
button{
  background:var(--accent);color:#04140d;border:none;border-radius:10px;padding:11px 20px;
  font-weight:700;cursor:pointer;font-size:.92rem;margin-top:14px;
}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
button:active{transform:translateY(1px);}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:16px;
}
.row{display:flex;justify-content:space-between;gap:12px;margin:6px 0;font-size:.88rem;}
.row .k{color:var(--muted);}
.mono-box{
  font-family:var(--mono);font-size:.8rem;background:var(--panel2);border:1px solid var(--border);
  border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto;
}
.codes-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.82rem;margin-top:8px;}
.codes-table th,.codes-table td{border-bottom:1px solid var(--border);padding:5px 8px;text-align:left;}
.codes-table th{color:var(--muted);font-weight:600;}
.error{color:var(--danger);font-size:.85rem;margin-top:10px;}
.hint{color:var(--muted);font-size:.8rem;margin-top:6px;}
.copybtn{font-size:.75rem;padding:4px 10px;margin:8px 0 0;}
.badge{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:6px;
  padding:2px 8px;font-size:.75rem;color:var(--accent2);margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Huffman Encoder / Decoder</h1>
  <div class="sub">Compress text into a binary string using Huffman coding, or decode a binary string back into text.</div>

  <div class="tabs">
    <div class="tab active" data-tab="encode">Encode (Text → Binary)</div>
    <div class="tab" data-tab="decode">Decode (Binary → Text)</div>
  </div>

  <div class="panel active" id="panel-encode">
    <label>Text to encode</label>
    <textarea id="inputText" placeholder="Type or paste text here...">the quick brown fox jumps over the lazy dog</textarea>
    <button id="btnEncode">Encode</button>
    <div class="error" id="encodeError"></div>
    <div id="encodeResult"></div>
  </div>

  <div class="panel" id="panel-decode">
    <label>Encoded binary string</label>
    <textarea id="inputBinary" placeholder="e.g. 010111001..."></textarea>
    <label>Codebook (JSON: character → binary code) <span class="badge">auto-filled after encoding</span></label>
    <textarea id="inputCodebook" placeholder='{"a":"010","b":"11",...}' style="min-height:70px;"></textarea>
    <button id="btnDecode">Decode</button>
    <button class="secondary" id="btnUseLast">Use last encoded result</button>
    <div class="error" id="decodeError"></div>
    <div id="decodeResult"></div>
  </div>
</div>

<script>
// ---------- Huffman core ----------
class Node{
  constructor(ch,freq,left=null,right=null){this.ch=ch;this.freq=freq;this.left=left;this.right=right;}
}

function buildFrequencies(text){
  const freq={};
  for(const ch of text){ freq[ch]=(freq[ch]||0)+1; }
  return freq;
}

function buildTree(freq){
  const chars=Object.keys(freq);
  if(chars.length===0) return null;
  if(chars.length===1){
    // single unique char: force a 2-node tree so it still gets a 1-bit code
    const only=chars[0];
    return new Node(null, freq[only], new Node(only,freq[only]), new Node('\u0000',0));
  }
  let nodes=chars.map(c=>new Node(c,freq[c]));
  while(nodes.length>1){
    nodes.sort((a,b)=>a.freq-b.freq);
    const a=nodes.shift(), b=nodes.shift();
    nodes.push(new Node(null,a.freq+b.freq,a,b));
  }
  return nodes[0];
}

function buildCodes(node,prefix,map){
  if(!node) return;
  if(node.ch!==null){
    map[node.ch]= prefix || "0";
    return;
  }
  buildCodes(node.left, prefix+"0", map);
  buildCodes(node.right, prefix+"1", map);
}

function encodeText(text){
  const freq=buildFrequencies(text);
  const tree=buildTree(freq);
  const codes={};
  buildCodes(tree,"",codes);
  let binary="";
  for(const ch of text){ binary+=codes[ch]; }
  return {freq,codes,binary,tree};
}

function decodeBinary(binary,codes){
  // invert codebook
  const rev={};
  for(const ch in codes){ rev[codes[ch]]=ch; }
  let out="", buf="";
  for(const bit of binary){
    if(bit!=='0' && bit!=='1') throw new Error("Binary string must contain only 0s and 1s.");
    buf+=bit;
    if(buf in rev){ out+=(rev[buf]==='\u0000'?'':rev[buf]); buf=""; }
  }
  if(buf.length>0) throw new Error("Leftover bits don't match any code — binary/codebook mismatch.");
  return out;
}

function escapeChar(ch){
  if(ch===' ') return '"␣" (space)';
  if(ch==='\n') return '"\\n" (newline)';
  if(ch==='\t') return '"\\t" (tab)';
  return '"'+ch+'"';
}

// ---------- UI wiring ----------
const tabs=document.querySelectorAll('.tab');
tabs.forEach(t=>t.addEventListener('click',()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-'+t.dataset.tab).classList.add('active');
}));

let lastResult=null;

document.getElementById('btnEncode').addEventListener('click',()=>{
  const err=document.getElementById('encodeError'); err.textContent="";
  const resultDiv=document.getElementById('encodeResult'); resultDiv.innerHTML="";
  const text=document.getElementById('inputText').value;
  if(text.length===0){ err.textContent="Enter some text first."; return; }
  try{
    const {freq,codes,binary}=encodeText(text);
    lastResult={binary,codes};

    const originalBits=text.length*8;
    const compressedBits=binary.length;
    const ratio=originalBits? ((1-compressedBits/originalBits)*100).toFixed(1) : 0;

    let rowsHtml="";
    Object.keys(codes).sort((a,b)=>codes[a].length-codes[b].length).forEach(ch=>{
      rowsHtml+=`<tr><td>${escapeChar(ch)}</td><td>${freq[ch]}</td><td>${codes[ch]}</td></tr>`;
    });

    resultDiv.innerHTML=`
      <div class="card">
        <div class="row"><span class="k">Original size</span><span>${originalBits} bits (${text.length} chars × 8)</span></div>
        <div class="row"><span class="k">Encoded size</span><span>${compressedBits} bits</span></div>
        <div class="row"><span class="k">Space saved</span><span>${ratio}%</span></div>
        <label>Encoded binary</label>
        <div class="mono-box" id="binOut">${binary}</div>
        <button class="secondary copybtn" id="copyBin">Copy binary</button>
        <label>Codebook (character → code)</label>
        <table class="codes-table"><thead><tr><th>Char</th><th>Freq</th><th>Code</th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
        <div class="hint">Switch to the Decode tab and click "Use last encoded result" to instantly decode this back.</div>
      </div>`;

    document.getElementById('copyBin').addEventListener('click',()=>{
      navigator.clipboard.writeText(binary).catch(()=>{});
    });
  }catch(e){
    err.textContent="Something went wrong: "+e.message;
  }
});

document.getElementById('btnUseLast').addEventListener('click',()=>{
  const err=document.getElementById('decodeError'); err.textContent="";
  if(!lastResult){ err.textContent="Encode some text first, on the Encode tab."; return; }
  document.getElementById('inputBinary').value=lastResult.binary;
  document.getElementById('inputCodebook').value=JSON.stringify(lastResult.codes,null,2);
});

document.getElementById('btnDecode').addEventListener('click',()=>{
  const err=document.getElementById('decodeError'); err.textContent="";
  const resultDiv=document.getElementById('decodeResult'); resultDiv.innerHTML="";
  const binary=document.getElementById('inputBinary').value.trim();
  const codebookRaw=document.getElementById('inputCodebook').value.trim();
  if(!binary){ err.textContent="Enter a binary string first."; return; }
  if(!codebookRaw){ err.textContent="Enter the codebook (character → code) used to encode this data."; return; }
  let codes;
  try{ codes=JSON.parse(codebookRaw); }
  catch(e){ err.textContent="Codebook isn't valid JSON. Example: {\"a\":\"010\",\"b\":\"11\"}"; return; }
  try{
    const text=decodeBinary(binary,codes);
    resultDiv.innerHTML=`
      <div class="card">
        <label>Decoded text</label>
        <div class="mono-box">${text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
      </div>`;
  }catch(e){
    err.textContent=e.message;
  }
});
</script>
</body>
</html>
